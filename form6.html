<main>
    <form action="#" id="contactc-form">
        <div class="form_item">
            <label for="topic">Тема</label><br>
            <select name="topic" id="topic">
                <option value="1">Заказать услугу</option>
                <option value="2">Оставить отзыв/замечание</option>
                <option value="3">Предложить сотрудничество</option>
                <option value="4">Другое</option>
            </select><br>
            <label for="name">Имя</label><br>
            <input type="text" id="name" placeholder="Ваше имя..." required>
        </div>
    <div class="form_item">
            <label for="email">E-mail</label><br>
            <input type="email" id="email" placeholder="example@mail.com" required>
        </div>
        <div class="form_item">
            <label for="date">Желаемая дата ответа</label><br>
            <input type="date" id="date" required>
        </div>
        
        <div class="form_item">
            <label for="tel">Контактный телефон</label><br>
            <input type="tel" id="tel" placeholder="+7 (999) 999-99-99" required>
        </div>

        <div class="form_item">
            <label for="textarea">Текст сообщения</label><br>
            <textarea id="textarea" rows="6" placeholder="Текст сообщения..." required></textarea>
        </div>
        
        <div class="form_item">
            <input type="submit" value="отправить запрос">
        </div>
    </form>
</main>
